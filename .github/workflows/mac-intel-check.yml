# Temporary: GitHub's Apple-silicon runners were out of capacity, so this checks the Mac build of
# Omnisampler and Omnisampler FX on an Intel runner and runs Apple's AU validation on both.
# Remove before merging into main.
name: Mac check (Intel runner)

on:
  push:
    branches: [omnisampler-sampling]

permissions:
  contents: read

jobs:
  mac-intel:
    name: macOS Intel (Omnisampler build, tests, auval)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_CONTOUR_EQ=OFF -DBUILD_CAPTURE_RACK=OFF -DCMAKE_OSX_ARCHITECTURES=x86_64
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: AU validation
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/Omnisampler/Omnisampler_artefacts/Release/AU/Omnisampler.component" "build/Omnisampler/OmnisamplerFX_artefacts/Release/AU/Omnisampler FX.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx OmFx Emac
          auval -v aumu Omns Emac
