name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (AU, VST3, Standalone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          set -e
          for p in "ContourEQ:Contour EQ" "CaptureRack:Capture Rack" "Omnisampler:Omnisampler"; do
            t="${p%%:*}"; n="${p#*:}"; a="build/$t/${t}_artefacts/Release"; d="pkg/$n"
            mkdir -p "$d"
            cp -R "$a/AU/$n.component" "$a/VST3/$n.vst3" "$a/Standalone/$n.app" "$d/"
            for b in "$d/$n.component" "$d/$n.vst3" "$d/$n.app"; do codesign --force --deep --sign - "$b"; done
            printf '%s\n' "$n" "" \
              "$n.app        Standalone: drag to Applications. First launch: System Settings > Privacy & Security > Open Anyway." \
              "$n.component  Audio Unit (Logic, GarageBand, ELooper): copy to ~/Library/Audio/Plug-Ins/Components/" \
              "$n.vst3       VST3: copy to ~/Library/Audio/Plug-Ins/VST3/" "" \
              "Not notarised. If a host won't load it, run in Terminal:" \
              "  xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/\"$n.component\" ~/Library/Audio/Plug-Ins/VST3/\"$n.vst3\"" \
              > "$d/README.txt"
            (cd pkg && ditto -c -k --keepParent "$n" "../$t-macos.zip")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-macos
          path: "*-macos.zip"
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-macos
          path: build/test-output/*.png
          if-no-files-found: ignore

  ios:
    name: iOS (AUv3 inside the app, unsigned compile check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
      - name: Build
        run: |
          set -e
          for t in ContourEQ CaptureRack Omnisampler; do
            echo "::group::$t"
            xcodebuild -project build-ios/EvanPlugins.xcodeproj -target ${t}_Standalone -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO -quiet
            echo "::endgroup::"
          done

  windows:
    name: Windows (VST3, Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --target ContourEQ_VST3 ContourEQ_Standalone CaptureRack_VST3 CaptureRack_Standalone Omnisampler_VST3 Omnisampler_Standalone contour_tests rack_tests omni_tests
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          $plugins = @(@("ContourEQ","Contour EQ"), @("CaptureRack","Capture Rack"), @("Omnisampler","Omnisampler"))
          foreach ($p in $plugins) {
            $t = $p[0]; $n = $p[1]; $a = "build/$t/${t}_artefacts/Release"; $d = "pkg/$n"
            New-Item -ItemType Directory -Force $d | Out-Null
            Copy-Item -Recurse "$a/VST3/$n.vst3" $d/
            Copy-Item "$a/Standalone/$n.exe" $d/
            @("$n", "", "$n.exe   Standalone: run it from anywhere. SmartScreen may warn (not signed): More info > Run anyway.",
              "$n.vst3  VST3: copy the whole folder to C:\Program Files\Common Files\VST3\ and rescan in your DAW.") | Set-Content "$d/README.txt"
            Compress-Archive -Path $d -DestinationPath "$t-windows.zip" -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-windows
          path: "*-windows.zip"
          if-no-files-found: error

  linux:
    name: Linux (tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
      - name: Build tests
        run: cmake --build build --target contour_tests rack_tests omni_tests
      - name: Test
        run: ctest --test-dir build --output-on-failure
